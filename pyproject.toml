[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-federated-learning"
version = "0.1.0"
description = "Privacy-Preserving Federated Learning & Byzantine-Robust Swarm Model Aggregation Engine for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Lakshitha Dananjaya", email = "dananjayarox01@gmail.com" }
]
keywords = [
    "ai-agents",
    "federated-learning",
    "byzantine-fault-tolerance",
    "differential-privacy",
    "smpc",
    "swarm-intelligence",
    "mcp",
    "privacy-preserving-ml"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "numpy>=1.22.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
agent-fl = "agent_federated_learning.cli:main"

[project.urls]
Homepage = "https://github.com/devsoniclk/agent-federated-learning"
Repository = "https://github.com/devsoniclk/agent-federated-learning"
Issues = "https://github.com/devsoniclk/agent-federated-learning/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_federated_learning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
